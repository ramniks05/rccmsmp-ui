<h2 mat-dialog-title class="delete-title">
  <div class="icon-wrapper">
    <mat-icon>delete</mat-icon>
  </div>
  <span>{{ data.title || 'Confirm Deletion' }}</span>
</h2>

<mat-dialog-content class="delete-content">
  <p class="main-message">
    {{ data.message }}
  </p>

  <p class="sub-message" *ngIf="data.subMessage">
    {{ data.subMessage }}
  </p>
</mat-dialog-content>

<mat-dialog-actions align="end" class="delete-actions">
  <button
    mat-stroked-button
    (click)="cancel()"
    [disabled]="isDeleting"
  >
    {{ data.cancelText || 'Cancel' }}
  </button>

  <button
    mat-raised-button
    color="warn"
    (click)="confirm()"
    [disabled]="isDeleting"
  >
    <mat-progress-spinner
      *ngIf="isDeleting"
      diameter="18"
      mode="indeterminate"
    ></mat-progress-spinner>

    <span *ngIf="!isDeleting">
      {{ data.confirmText || 'Delete' }}
    </span>
  </button>
</mat-dialog-actions>
